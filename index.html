<!DOCTYPE html>
<html lang="ja">
<head>

  <meta charset="UTF-8">
  <title>Private Image Viewer</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #1a1a1a; color: #fff; }
    .gallery { margin-top: 20px; }
    img { max-width: 100%; height: auto; border-radius: 8px; border: 1px solid #444; }
    iframe { width: 100%; height: 75vh; border: 1px solid #444; background: #fff; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>

</head>
<body>

  <h1>Private Image Viewer</h1>
  <label for="file-name">ファイル名</label>
  <input id="file-name" type="text" placeholder="例: sample.txt" autocomplete="off" value="test-data/test1.bin">
  <button id="get-buttom">ファイルを読み込む</button>
  
  <div class="gallery">
    <img id="target-image" alt="読み込み中..." style="display: none;">
    <iframe id="target-pdf" title="PDF表示" style="display: none;"></iframe>
    <pre id="text" style="display: none;"></pre>
    <a id="download-file" target="_blank" rel="noopener" style="display: none;">ファイルを開く</a>
  </div>

  <script type="module" src="index.js"></script>
</body>
</html>
